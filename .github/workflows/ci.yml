name: CI

# Branches are tested through their pull request (against the merge result);
# a push trigger on every branch as well would run CI twice per update.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes its running check; every commit
# that lands on main is tested to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache clang lld ninja-build python3-venv shellcheck \
            device-tree-compiler gcc-aarch64-linux-gnu mtools \
            bison flex libssl-dev libgnutls28-dev \
            libglib2.0-dev libpixman-1-dev libfdt-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('.gitmodules', 'patches/**', 'overlay/**') }}
          restore-keys: ccache-${{ runner.os }}-

      # QEMU's configure does not wrap the compiler in ccache by itself
      - name: Enable ccache
        run: echo /usr/lib/ccache >> "$GITHUB_PATH"

      # ruff is pinned here; its rules are in ruff.toml
      - name: Install ruff
        run: pipx install ruff==0.15.20

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make check

      # Kconfig resolves the machine's devices without the other boards
      - name: Configure with raspi5b as the only board
        run: make check-minimal

      # dt-schema is pinned with the kernel tag the bindings come from
      - name: Install dt-schema
        run: |
          python3 -m venv "$RUNNER_TEMP/dtschema"
          "$RUNNER_TEMP/dtschema/bin/pip" install --quiet dtschema==2026.9
          echo "$RUNNER_TEMP/dtschema/bin" >> "$GITHUB_PATH"

      - name: Restore processed device-tree bindings
        uses: actions/cache@v4
        with:
          path: build-dt-schema
          key: dt-schema-2026.9-${{ hashFiles('Makefile') }}

      - name: Validate the built-in device tree
        run: make check-dt

      # Built from the pins in the script, which make up the cache key
      - name: Restore the firmware
        uses: actions/cache@v4
        with:
          path: build-firmware
          key: firmware-${{ hashFiles('scripts/firmware') }}

      - name: Boot real firmware
        run: make check-firmware

      - name: Compiler cache statistics
        run: ccache --show-stats
